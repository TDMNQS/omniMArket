<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="omx-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A6B" />
      <stop offset="100%" stop-color="#EF233C" />
    </linearGradient>
    <linearGradient id="omx-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0C0C0E" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Omni Orbital Ring -->
  <ellipse cx="32" cy="32" rx="22" ry="12" stroke="url(#omx-red)" stroke-width="3" transform="rotate(-30 32 32)" stroke-dasharray="4 2" opacity="0.85" filter="url(#glow)"/>
  <ellipse cx="32" cy="32" rx="22" ry="12" stroke="url(#omx-green)" stroke-width="3" transform="rotate(30 32 32)" opacity="0.9" filter="url(#glow)"/>
  <!-- Glowing Center Core / X node -->
  <circle cx="32" cy="32" r="5" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Futuristic X crossing points -->
  <path d="M22 22L42 42M42 22L22 42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
